services:
  # 1. Python FastAPI Backend Service
  - type: web
    name: crimegpt-ksp-backend
    env: python
    plan: free
    region: singapore
    buildCommand: "pip install -r backend/requirements.txt && python backend/seed_database.py"
    startCommand: "cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.5

  # 2. React Vite Frontend Static Site
  - type: web
    name: crimegpt-ksp-frontend
    env: static
    plan: free
    buildCommand: "cd frontend && npm install && npm run build"
    staticPublishPath: "frontend/dist"
    envVars:
      - key: VITE_API_BASE_URL
        value: "https://crimegpt-ksp-backend.onrender.com" # Fallback, or can be set via Render UI.
